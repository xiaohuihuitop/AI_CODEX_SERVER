<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Codex Windows Bridge</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --text: #111827;
      --muted: #5b6472;
      --line: #d9dde3;
      --accent: #1f6feb;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 12px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 16px 16px minmax(0, 0.9fr) minmax(0, 1.1fr) 44px;
      gap: 8px;
      align-items: center;
    }

    select {
      min-width: 0;
      width: 100%;
      height: 38px;
      border: 0;
      border-bottom: 1px solid #9ca3af;
      border-radius: 0;
      background: transparent;
      padding: 0;
      color: var(--text);
      font: inherit;
    }

    main {
      padding: 12px;
      padding-bottom: 96px;
    }

    .message {
      max-width: min(92%, 760px);
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message > :first-child {
      margin-top: 0;
    }

    .message > :last-child {
      margin-bottom: 0;
    }

    .message p,
    .message ul,
    .message ol,
    .message blockquote,
    .message pre,
    .message table {
      margin: 0.55em 0;
    }

    .message ul,
    .message ol {
      padding-left: 1.4em;
    }

    .message blockquote {
      border-left: 3px solid var(--line);
      padding-left: 10px;
      color: var(--muted);
    }

    .message pre {
      overflow-x: auto;
      padding: 10px;
      border-radius: 6px;
      background: #0f172a;
      color: #e5e7eb;
      white-space: pre;
    }

    .message code {
      border-radius: 4px;
      padding: 1px 4px;
      background: rgba(15, 23, 42, 0.08);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    .message pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .message table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .message th,
    .message td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: left;
    }

    .message a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .user {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
    }

    .assistant {
      margin-right: auto;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .process-card {
      max-width: min(92%, 760px);
      margin: 10px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      overflow: hidden;
    }

    .process-card details {
      padding: 0;
    }

    .process-card summary {
      cursor: pointer;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      background: #f9fafb;
      user-select: none;
    }

    .process-step {
      padding: 9px 12px;
      border-top: 1px solid #edf0f3;
      font-size: 13px;
      line-height: 1.45;
    }

    .process-step strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 12px;
    }

    .process-step :first-child {
      margin-top: 0;
    }

    .process-step :last-child {
      margin-bottom: 0;
    }

    form {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px 48px;
      gap: 8px;
      padding: 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--panel);
      border-top: 1px solid var(--line);
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      border: 1px solid #c7ccd3;
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font: inherit;
      line-height: 1.35;
    }

    button {
      min-width: 0;
      height: 38px;
      border: 0;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #stop {
      background: var(--danger);
    }

    .notice {
      min-height: 32px;
      font-size: 12px;
      color: var(--muted);
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid #e5e7eb;
    }

    .connection-status,
    .thread-status {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid #c7ccd3;
      background: #9ca3af;
    }

    .connection-status--online {
      border-color: #15803d;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    .connection-status--offline {
      border-color: #b42318;
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
    }

    .thread-status--running {
      border-color: #1d4ed8;
      background: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .thread-status--complete {
      border-color: #15803d;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }
  </style>
</head>
<body>
  <header>
    <span id="connectionStatus" class="connection-status" title="连接状态未知"></span>
    <span id="threadStatus" class="thread-status" title="当前对话空闲"></span>
    <select id="projects" aria-label="选择 Codex 文件夹"></select>
    <select id="threads" aria-label="选择 Codex 线程"></select>
    <button id="refresh" type="button" title="重新读取对话列表和当前对话历史" aria-label="刷新对话">刷新</button>
  </header>
  <div class="notice" id="notice">正在连接本机服务...</div>
  <main id="messages"></main>
  <form id="composer">
    <textarea id="text" placeholder="发消息给电脑 Codex"></textarea>
    <button id="send" type="submit">发</button>
    <button id="stop" type="button">停</button>
  </form>
  <script src="/markdown.js?v=1"></script>
  <script>
    const tokenFromUrl = new URLSearchParams(location.search).get('token') || '';
    if (tokenFromUrl) localStorage.setItem('codexBridge.token', tokenFromUrl);
    const token = tokenFromUrl || localStorage.getItem('codexBridge.token') || '';
    const projectsEl = document.getElementById('projects');
    const threadsEl = document.getElementById('threads');
    const connectionStatusEl = document.getElementById('connectionStatus');
    const threadStatusEl = document.getElementById('threadStatus');
    const messagesEl = document.getElementById('messages');
    const noticeEl = document.getElementById('notice');
    const textEl = document.getElementById('text');
    const sendButton = document.getElementById('send');
    const stopButton = document.getElementById('stop');
    let selectedThreadId = localStorage.getItem('codexBridge.threadId') || '';
    let selectedProjectName = localStorage.getItem('codexBridge.projectName') || '';
    let threadRows = [];
    let realtimeSocket = null;
    let realtimeReconnectTimer = null;
    let realtimeRefreshTimer = null;
    let pendingRealtimeRefreshOptions = null;
    let automaticRefreshTimer = null;
    const AUTO_REFRESH_INTERVAL_MS = 4000;
    let threadListRequest = null;
    let currentThreadStatus = null;
    let pendingWatch = null;
    let sending = false;
    let historyReloadedForCompletion = false;
    let runningHistoryRequest = null;
    let runningHistorySyncAt = 0;
    let runningHistoryThreadId = '';
    let agentOnline = false;
    let syncState = { fresh: false, version: 0, lastSyncedAt: '' };
    let appServerState = { state: 'unknown', updatedAt: '' };
    const realtimeThreadStates = new Map();
    let commandConfirmTimer = null;
    let pendingLocalSends = [];
    let renderedHistorySignature = '';
    let renderedHistoryRows = [];
    let clientMessageSequence = 0;
    const REALTIME_REFRESH_RETRY_LIMIT = 6;
    const REALTIME_REFRESH_RETRY_DELAY_MS = 500;

    /**
     * AI:为一次用户提交生成跨层复用的幂等标识。
     *
     * @returns {string} 客户端用户消息标识。
     */
    function createClientUserMessageId() {
      clientMessageSequence += 1;
      return `web-${Date.now().toString(36)}-${clientMessageSequence.toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }

    /**
     * 调用本机桥接 API。
     *
     * @param {string} apiPath API 路径。
     * @param {RequestInit} options 请求选项。
     * @returns {Promise<Response>} fetch 响应。
     */
    function api(apiPath, options = {}) {
      const headers = { ...(options.headers || {}), 'x-mobile-typer-token': token };
      return fetch(apiPath, { ...options, headers, cache: 'no-store' });
    }

    /**
     * 更新顶部状态文本。
     *
     * @param {string} text 状态文本。
     * @returns {void}
     */
    function notice(text) {
      noticeEl.textContent = text;
    }

    /**
     * AI:记录当前滚动位置，自动刷新内容后用于还原阅读位置。
     *
     * @returns {{y: number}} 滚动快照。
     */
    function captureScroll() {
      return { y: window.scrollY || 0 };
    }

    /**
     * AI:还原刷新前的滚动位置，避免后台轮询把页面推到底部。
     *
     * @param {{y: number}|null} snapshot 滚动快照。
     * @returns {void}
     */
    function restoreScroll(snapshot) {
      if (!snapshot) return;
      window.scrollTo(0, Math.min(snapshot.y, Math.max(0, document.body.scrollHeight - window.innerHeight)));
    }

    /**
     * AI:只在明确需要跟随新消息时滚动到底部。
     *
     * @returns {void}
     */
    function scrollToBottom() {
      window.scrollTo(0, document.body.scrollHeight);
    }

    /**
     * AI:过滤 Codex Desktop 注入的浏览器上下文和客户端指令。
     *
     * @param {string} text 原始消息文本。
     * @returns {string} 可展示文本。
     */
    function stripCodexUiDirectives(text) {
      const lines = [];
      let inBrowserContext = false;

      for (const line of String(text || '').split(/\r?\n/)) {
        const trimmed = line.trim();
        const isBrowserHeader = /^(?:#+\s*)?In app browser:\s*$/i.test(trimmed);
        const isRequestHeader = /^(?:#+\s*)?My request for Codex:\s*$/i.test(trimmed);
        const isBrowserMeta = /^[-*]\s*(?:The user has the in-app browser open\.?|Current URL:.*)$/i.test(trimmed);

        if (isBrowserHeader) {
          inBrowserContext = true;
          continue;
        }
        if (isRequestHeader) {
          inBrowserContext = false;
          continue;
        }
        if (inBrowserContext) {
          if (!trimmed || isBrowserMeta) continue;
          inBrowserContext = false;
        }
        if (isBrowserMeta) continue;
        lines.push(line);
      }

      return lines
        .filter(line => !/^::[a-z][a-z-]*\{.*\}\s*$/i.test(line.trim()))
        .join('\n')
        .trim();
    }

    /**
     * AI:把 Markdown 文本清洗后渲染为 HTML。
     *
     * @param {string} text Markdown 文本。
     * @returns {string} HTML 字符串。
     */
    function renderCleanMarkdown(text) {
      return CodexMarkdown.renderMarkdownToHtml(stripCodexUiDirectives(text));
    }

    /**
     * 更新手机端到云端 Agent 的连接状态。
     *
     * @param {{online?: boolean, offline?: boolean, message?: string}} state 连接状态。
     * @returns {void}
     */
    function updateConnectionStatus(state) {
      const online = Boolean(state?.online);
      const offline = Boolean(state?.offline);
      agentOnline = online;
      connectionStatusEl.classList.toggle('connection-status--online', online);
      connectionStatusEl.classList.toggle('connection-status--offline', !online && offline);
      const title = online ? '服务器已连接，电脑 Agent 在线' : state?.message || '连接状态未知';
      connectionStatusEl.title = title;
      connectionStatusEl.setAttribute('aria-label', title);
    }

    /**
     * 刷新云端与 Agent 在线状态。
     *
     * @returns {Promise<void>}
     */
    async function refreshConnectionStatus() {
      try {
        const res = await api(`/codex/health?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (res.ok && data.ok) {
          updateConnectionStatus({
            online: Boolean(data.online),
            offline: !data.online,
            message: data.online ? '服务器已连接，电脑 Agent 在线' : '服务器可访问，电脑 Agent 未在线',
          });
          return;
        }
        updateConnectionStatus({ offline: true, message: data.message || '服务器可访问，电脑 Agent 未在线' });
      } catch {
        updateConnectionStatus({ offline: true, message: '服务器不可访问' });
      }
    }

    /**
     * AI:使用服务端响应里的 Agent 在线状态更新连接指示，避免缓存接口成功被误判为在线。
     *
     * @param {object} data 接口响应。
     * @returns {void}
     */
    function applyAgentOnline(data) {
      if (!data || typeof data.agentOnline !== 'boolean') return;
      updateConnectionStatus({
        online: data.agentOnline,
        offline: !data.agentOnline,
        message: data.agentOnline ? '服务器已连接，电脑 Agent 在线' : '服务器可访问，电脑 Agent 未在线',
      });
    }

    /**
     * 追加消息气泡。
     *
     * @param {'user'|'assistant'} role 消息角色。
     * @param {string} text 消息文本。
     * @returns {HTMLDivElement} 消息元素。
     */
    function message(role, text, options = {}) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (options.turnId) div.dataset.turnId = options.turnId;
      if (options.pending) div.dataset.pending = 'true';
      if (options.id) div.dataset.messageId = options.id;
      div.innerHTML = renderCleanMarkdown(text);
      messagesEl.appendChild(div);
      if (options.scrollToBottom !== false) scrollToBottom();
      return div;
    }

    /**
     * AI:记录网页端已发送但尚未被电脑端历史确认的消息。
     *
     * @param {string} threadId Codex 线程 ID。
     * @param {string} text 用户发送文本。
     * @param {number} sentAt 本地发送时间戳。
     * @param {number} baseMessageCount 发送前历史消息数量。
     * @returns {object} 本地待确认消息。
     */
    function registerPendingLocalSend(threadId, text, sentAt, baseMessageCount) {
      const row = {
        threadId,
        text,
        userId: `local-user-${sentAt}`,
        assistantId: `local-assistant-${sentAt}`,
        baseMessageCount,
        turnId: '',
      };
      pendingLocalSends = pendingLocalSends.concat([row]);
      return row;
    }

    /**
     * AI:发送失败后移除本地待确认消息。
     *
     * @param {object} pending 本地待确认消息。
     * @returns {void}
     */
    function removePendingLocalSend(pending) {
      const rows = [];
      for (const row of pendingLocalSends) {
        if (row !== pending) rows.push(row);
      }
      pendingLocalSends = rows;
    }

    /**
     * AI:把运行轮次绑定到本地待确认消息，保证处理过程插入用户消息之后。
     *
     * @param {string} turnId Codex 轮次 ID。
     * @returns {void}
     */
    function bindPendingLocalSendTurn(turnId) {
      if (!turnId) return;
      const rows = pendingLocalSends.slice();
      for (let index = rows.length - 1; index >= 0; index -= 1) {
        if (!rows[index].turnId && rows[index].threadId === selectedThreadId) {
          rows[index] = Object.assign({}, rows[index], { turnId });
          pendingLocalSends = rows;
          return;
        }
      }
    }

    /**
     * AI:判断历史中是否已出现指定消息。
     *
     * @param {Array<object>} rows 历史消息。
     * @param {string} role 消息角色。
     * @param {string} text 消息文本。
     * @param {number} startIndex 起始检查位置。
     * @returns {boolean} 已出现返回 true。
     */
    function hasHistoryMessage(rows, role, text, startIndex = 0) {
      for (let index = Math.max(0, Number(startIndex) || 0); index < (rows || []).length; index += 1) {
        const row = rows[index];
        if (row && row.role === role && String(row.text || '') === text) return true;
      }
      return false;
    }

    /**
     * AI:判断待确认消息之后是否已经有电脑端回复。
     *
     * @param {Array<object>} rows 历史消息。
     * @param {object} pending 本地待确认消息。
     * @returns {boolean} 已有回复返回 true。
     */
    function hasAssistantAfterPendingBase(rows, pending) {
      const start = Math.max(0, Number(pending && pending.baseMessageCount) || 0);
      for (let index = start; index < (rows || []).length; index += 1) {
        const row = rows[index];
        if (row && row.role === 'assistant') return true;
      }
      return false;
    }

    /**
     * AI:合并电脑端历史和网页端待确认消息，避免刷新覆盖刚发送的用户消息。
     *
     * @param {string} threadId Codex 线程 ID。
     * @param {Array<object>} historyRows 电脑端历史消息。
     * @returns {Array<object>} 可展示消息。
     */
    function mergePendingLocalMessages(threadId, historyRows) {
      const rows = (historyRows || []).slice();
      const nextPending = [];
      let insertedCount = 0;
      for (const pending of pendingLocalSends) {
        if (!pending || pending.threadId !== threadId) {
          nextPending.push(pending);
          continue;
        }
        if (hasHistoryMessage(rows, 'user', pending.text, pending.baseMessageCount)) continue;
        nextPending.push(pending);
        const localRows = [];
        localRows.push({ role: 'user', text: pending.text, pending: true, id: pending.userId });
        if (!hasAssistantAfterPendingBase(rows, pending)) {
          localRows.push({ role: 'assistant', text: '已发送，等待 Codex 回复...', pending: true, id: pending.assistantId, turnId: pending.turnId });
        }
        const insertAt = Math.min(rows.length, Math.max(0, (Number(pending.baseMessageCount) || 0) + insertedCount));
        for (let localIndex = 0; localIndex < localRows.length; localIndex += 1) {
          rows.splice(insertAt + localIndex, 0, localRows[localIndex]);
        }
        insertedCount += localRows.length;
      }
      pendingLocalSends = nextPending;
      return rows;
    }

    /**
     * AI:为历史消息生成稳定签名，只有内容变化时才重建消息 DOM。
     *
     * @param {Array<object>} rows 当前历史消息。
     * @returns {string} 消息内容签名。
     */
    function historyRowsSignature(rows) {
      return (rows || []).map(row => [
        row && row.role || '',
        row && row.text || '',
        row && row.timestamp || '',
        row && row.turnId || '',
        row && row.pending ? 'pending' : '',
        row && row.id || '',
      ].join('\u0000')).join('\u0001');
    }

    /**
     * AI:以同一份消息模型更新网页 DOM，避免发送响应期间的历史同步与本地气泡并存。
     *
     * @param {Array<object>} rows 已合并的消息列表。
     * @returns {void}
     */
    function renderHistoryRows(rows) {
      const nextRows = (rows || []).slice();
      const historySignature = historyRowsSignature(nextRows);
      if (historySignature !== renderedHistorySignature) {
        messagesEl.innerHTML = '';
        for (const row of nextRows) message(row.role, row.text || '', { scrollToBottom: false, turnId: row.turnId || '', pending: Boolean(row.pending), id: row.id || '' });
        renderedHistorySignature = historySignature;
      }
      renderedHistoryRows = nextRows;
    }

    /**
     * 提取每轮可显示的处理过程。
     *
     * @param {object} status Codex 状态数据。
     * @returns {Array<object>} 过程轮次。
     */
    function processTurns(status) {
      return (status?.turns || [])
        .map(turn => {
          const interrupted = Boolean(turn?.status === 'interrupted' || (turn?.status === 'running' && (!agentOnline || !syncState.fresh)));
          return {
            turnId: turn?.turnId || '',
            status: interrupted ? 'interrupted' : turn?.status || '',
            steps: (turn?.steps || []).filter(step => step?.text && step.kind !== 'start' && step.kind !== 'final' && step.kind !== 'complete'),
            interruptionReason: turn?.interruptionReason || (!agentOnline ? 'Agent 未在线' : '状态未确认'),
            durationText: formatElapsedTime(turn?.startedAt || '', turn?.completedAt || '', interrupted ? syncState.lastSyncedAt : ''),
          };
        })
        .filter(turn => turn.turnId && turn.steps.length);
    }

    /**
     * AI:格式化当前轮次已处理时间。
     *
     * @param {string} startedAt 开始时间。
     * @param {string} completedAt 完成时间。
     * @returns {string} 已处理时间文本。
     */
    function formatElapsedTime(startedAt, completedAt, observedAt = '') {
      const start = Date.parse(startedAt || '');
      if (Number.isNaN(start)) return '';
      const end = Date.parse(completedAt || observedAt || '') || Date.now();
      const totalSeconds = Math.max(0, Math.floor((end - start) / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      if (minutes > 0) return `已处理 ${minutes}m ${seconds}s`;
      return `已处理 ${seconds}s`;
    }

    /**
     * AI:生成处理过程标题。
     *
     * @param {object} turn 当前轮次。
     * @returns {string} 标题文本。
     */
    function processSummaryText(turn) {
      const count = turn?.steps?.length || 0;
      const prefix = '处理过程已折叠';
      if (turn?.status === 'interrupted') return `${prefix} · ${turn.interruptionReason || '状态未确认'}${turn.durationText ? ` · ${turn.durationText}` : ''}（${count}）`;
      const duration = turn.durationText ? ` · ${turn.durationText}` : '';
      return `${prefix}${duration}（${count}）`;
    }

    /**
     * AI:把发送后的临时回复绑定到当前运行轮次。
     *
     * @param {object} status Codex 状态数据。
     * @returns {void}
     */
    function bindPendingAssistantTurn(status) {
      const turns = processTurns(status);
      let runningTurn = null;
      for (const turn of turns) {
        if (turn.status === 'running') runningTurn = turn;
      }
      if (!runningTurn && status?.active && turns.length) runningTurn = turns[turns.length - 1];
      if (!runningTurn) return;
      bindPendingLocalSendTurn(runningTurn.turnId);
      const pendingRows = messagesEl.querySelectorAll('.message.assistant[data-pending="true"]');
      const pending = pendingRows[pendingRows.length - 1];
      if (pending) pending.dataset.turnId = runningTurn.turnId;
    }

    /**
     * AI:查找指定轮次对应的最终回复元素。
     *
     * @param {string} turnId 轮次 ID。
     * @returns {Element|null} 最终回复元素。
     */
    function findAssistantMessageByTurn(turnId) {
      for (const item of messagesEl.querySelectorAll('.message.assistant')) {
        if (item.dataset.turnId === turnId) return item;
      }
      return null;
    }

    /**
     * AI:按轮次查找用户消息，避免依赖旧 Android WebView 未实现的 CSS.escape。
     *
     * @param {string} turnId 轮次 ID。
     * @returns {Element|null} 用户消息元素。
     */
    function findUserMessageByTurn(turnId) {
      for (const item of messagesEl.querySelectorAll('.message.user')) {
        if (item.dataset.turnId === turnId) return item;
      }
      return null;
    }

    /**
     * AI:创建单轮处理过程面板。
     *
     * @param {object} turn 处理轮次。
     * @returns {HTMLElement} 处理过程面板。
     */
    function createProcessCard(turn) {
      const card = document.createElement('section');
      card.className = 'process-card';
      card.dataset.turnId = turn.turnId;
      const details = document.createElement('details');
      details.open = false;
      const summary = document.createElement('summary');
      summary.textContent = processSummaryText(turn);
      details.appendChild(summary);

      for (const step of turn.steps) {
        const row = document.createElement('div');
        row.className = 'process-step';
        const label = document.createElement('strong');
        label.textContent = step.label || '过程';
        row.appendChild(label);
        const body = document.createElement('div');
        body.innerHTML = renderCleanMarkdown(step.text || '');
        row.appendChild(body);
        details.appendChild(row);
      }

      card.appendChild(details);
      return card;
    }

    /**
     * AI:仅在轮次内容实际变化时替换过程卡，保留展开状态并消除轮询闪烁。
     *
     * @param {object} turn 处理轮次。
     * @returns {string} 可比较的轮次内容标识。
     */
    function processCardSignature(turn) {
      return JSON.stringify({
        status: turn.status || '',
        durationText: turn.durationText || '',
        steps: (turn.steps || []).map(step => [step.kind || '', step.label || '', step.time || '', step.text || '']),
      });
    }

    /**
     * AI:判断没有匹配到最终回复的处理过程是否允许临时追加到底部。
     *
     * @param {object} turn 处理轮次。
     * @returns {boolean} 只有当前运行轮次允许追加。
     */
    function shouldAppendUnmatchedProcess(turn) {
      return false;
    }

    /**
     * 渲染处理过程面板，默认折叠且只通过用户手动展开。
     *
     * @param {object} status Codex 状态数据。
     * @returns {void}
     */
    function renderProcessPanel(status, options = {}) {
      const scroll = options.preserveScroll === false ? null : captureScroll();
      const turns = processTurns(status);
      const expectedTurnIds = new Set(turns.map(turn => turn.turnId));

      for (const turn of turns) {
        const signature = processCardSignature(turn);
        const existing = Array.from(messagesEl.querySelectorAll('.process-card')).find(item => item.dataset.turnId === turn.turnId);
        if (existing && existing.dataset.signature === signature) continue;
        const card = createProcessCard(turn);
        card.dataset.signature = signature;
        const wasOpen = Boolean(existing?.querySelector('details')?.open);
        card.querySelector('details').open = wasOpen;
        const assistant = findAssistantMessageByTurn(turn.turnId);
        const user = findUserMessageByTurn(turn.turnId);
        if (existing) existing.replaceWith(card);
        else if (user) user.insertAdjacentElement('afterend', card);
        else if (assistant) messagesEl.insertBefore(card, assistant);
      }
      for (const card of messagesEl.querySelectorAll('.process-card')) {
        if (!expectedTurnIds.has(card.dataset.turnId)) card.remove();
      }
      if (options.scrollToBottom) scrollToBottom();
      else restoreScroll(scroll);
    }

    /**
     * 切换运行态按钮状态。
     *
     * @param {boolean} running 是否正在等待回复。
     * @returns {void}
     */
    function setRunning(running) {
      const waitingForDesktop = pendingWatch?.threadId === selectedThreadId;
      sendButton.disabled = Boolean(running || sending || waitingForDesktop);
      stopButton.disabled = Boolean(!running || sending || waitingForDesktop);
    }

    /**
     * 判断当前状态是否已经确认本次控制命令已进入桌面端。
     *
     * @param {object} status 当前线程状态。
     * @returns {boolean} 已确认返回 true。
     */
    function isCommandConfirmed(status) {
      if (!pendingWatch || pendingWatch.threadId !== status?.threadId || !syncState.fresh) return false;
      const stateConfirmed = status.active || status.status === 'running' || status.status === 'complete' || status.status === 'error';
      if (pendingWatch.kind === 'send') {
        const confirmedTurnIds = Array.isArray(status.confirmedControlTurnIds) ? status.confirmedControlTurnIds : [];
        return Boolean(pendingWatch.turnId && confirmedTurnIds.includes(pendingWatch.turnId) && stateConfirmed);
      }
      return Boolean(
        pendingWatch.kind === 'stop'
        && Number(status.syncVersion) > Number(pendingWatch.acceptedSyncVersion)
        && !status.active
        && status.status !== 'running'
      );
    }

    /**
     * 清理已被新同步快照确认的控制等待状态。
     *
     * @returns {void}
     */
    function clearConfirmedCommandWatch() {
      pendingWatch = null;
      if (commandConfirmTimer) clearTimeout(commandConfirmTimer);
      commandConfirmTimer = null;
    }

    /**
     * 按项目名分组线程。
     *
     * @param {Array<{id: string, name: string, projectName?: string}>} rows 线程列表。
     * @returns {Map<string, Array<object>>} 项目分组。
     */
    function groupThreads(rows) {
      const groups = new Map();
      for (const row of rows || []) {
        const projectName = row.projectName || '未命名文件夹';
        if (!groups.has(projectName)) groups.set(projectName, []);
        groups.get(projectName).push(row);
      }
      return groups;
    }

    /**
     * 更新当前线程运行状态指示点。
     *
     * @returns {void}
     */
    function updateThreadStatus(statusData = null) {
      const row = threadRows.find(item => item.id === selectedThreadId);
      const scopedStatus = statusData?.threadId === selectedThreadId ? statusData : null;
      const realtime = realtimeThreadStates.get(selectedThreadId) || null;
      if (scopedStatus && isCommandConfirmed(scopedStatus)) clearConfirmedCommandWatch();
      const awaitingDesktopConfirmation = pendingWatch?.threadId === selectedThreadId && pendingWatch.kind === 'send';
      if (awaitingDesktopConfirmation) {
        threadStatusEl.classList.remove('thread-status--running', 'thread-status--complete');
        threadStatusEl.title = '正在等待电脑确认发送';
        threadStatusEl.setAttribute('aria-label', threadStatusEl.title);
        setRunning(false);
        return;
      }
      const status = realtime?.status || scopedStatus?.status || row?.status || 'idle';
      const active = realtime ? realtime.active : Boolean(scopedStatus?.active) || Boolean(row?.active);
      const running = realtime ? agentOnline && status === 'running' : agentOnline && syncState.fresh && (active || status === 'running');
      const complete = !running && status === 'complete';
      threadStatusEl.classList.toggle('thread-status--running', running);
      threadStatusEl.classList.toggle('thread-status--complete', complete);
      threadStatusEl.title = running ? '当前对话正在工作' : complete ? '当前对话已完成' : '当前对话未连接或空闲';
      threadStatusEl.setAttribute('aria-label', threadStatusEl.title);
      setRunning(running);
    }

    /**
     * 渲染当前项目下的线程选择。
     *
     * @returns {void}
     */
    function renderThreadOptions() {
      const groups = groupThreads(threadRows);
      const rows = groups.get(selectedProjectName) || [];
      threadsEl.innerHTML = '';
      for (const item of rows) {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = item.name || item.id;
        threadsEl.appendChild(option);
      }
      if (!rows.some(item => item.id === selectedThreadId)) selectedThreadId = rows[0]?.id || '';
      threadsEl.value = selectedThreadId;
      if (selectedThreadId) localStorage.setItem('codexBridge.threadId', selectedThreadId);
      updateThreadStatus();
    }

    /**
     * 读取 Codex Desktop 当前打开线程列表，并复用正在进行中的请求。
     *
     * @param {string} errorMessage 读取失败时的错误文本。
     * @returns {Promise<Array<object>>} 线程列表。
     */
    async function fetchThreadRows(errorMessage) {
      if (threadListRequest) return threadListRequest;
      threadListRequest = (async () => {
        const res = await api(`/codex/threads?limit=160&token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) {
          updateConnectionStatus({ offline: true, message: data.message || errorMessage });
          throw new Error(data.message || errorMessage);
        }
        if (!applyRelayState(data)) return threadRows;
        return data.threads || [];
      })();
      try {
        return await threadListRequest;
      } finally {
        threadListRequest = null;
      }
    }

    /**
     * 加载 Codex 线程列表。
     *
     * @returns {Promise<void>}
     */
    async function loadThreads() {
      threadRows = await fetchThreadRows('读取线程失败');
      const groups = groupThreads(threadRows);
      projectsEl.innerHTML = '';
      for (const projectName of groups.keys()) {
        const option = document.createElement('option');
        option.value = projectName;
        option.textContent = projectName;
        projectsEl.appendChild(option);
      }
      const selectedRow = threadRows.find(item => item.id === selectedThreadId);
      if (selectedRow) selectedProjectName = selectedRow.projectName || '未命名文件夹';
      if (!groups.has(selectedProjectName)) selectedProjectName = [...groups.keys()][0] || '';
      projectsEl.value = selectedProjectName;
      if (selectedProjectName) localStorage.setItem('codexBridge.projectName', selectedProjectName);
      renderThreadOptions();
      updateThreadStatus();
    }

    /**
     * 刷新当前打开线程的运行状态。
     *
     * @returns {Promise<void>}
     */
    async function refreshThreadStatuses() {
      threadRows = await fetchThreadRows('读取线程状态失败');
      updateThreadStatus(currentThreadStatus);
    }

    /**
     * 加载当前线程历史。
     *
     * @param {object|null} statusData 已读取的线程状态，避免重复请求。
     * @param {{preserveScroll?: boolean, scrollToBottom?: boolean}} options 滚动控制选项。
     * @returns {Promise<void>}
     */
    async function loadHistory(statusData = null, options = {}) {
      const requestedThreadId = selectedThreadId;
      if (!requestedThreadId) {
        messagesEl.innerHTML = '';
        renderedHistorySignature = '';
        renderedHistoryRows = [];
        notice('没有可用 Codex 线程');
        return;
      }
      const scroll = options.preserveScroll === false ? null : captureScroll();
      const res = await api(`/codex/history?thread=${encodeURIComponent(requestedThreadId)}&limit=120&token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.message || '读取历史失败');
      if (requestedThreadId !== selectedThreadId || data.threadId !== requestedThreadId) return;
      const rows = mergePendingLocalMessages(requestedThreadId, data.messages || []);
      renderHistoryRows(rows);
      if (data.available) {
        const snapshot = statusData?.threadId === requestedThreadId
          ? statusData
          : await fetchStatus({ threadId: requestedThreadId });
        if (requestedThreadId !== selectedThreadId || snapshot?.threadId !== requestedThreadId) return;
        reconcileRealtimeThreadState(snapshot);
        currentThreadStatus = snapshot;
        bindPendingAssistantTurn(snapshot);
        updateThreadStatus(snapshot);
        renderProcessPanel(snapshot, { preserveScroll: false });
      }
      if (options.scrollToBottom) scrollToBottom();
      else restoreScroll(scroll);
      if (!options.silent) notice(data.available ? '已同步本机 Codex 线程' : '这个线程暂时没有可加载的本机记录');
    }

    /**
     * 读取当前线程状态。
     *
     * @param {{threadId?: string, since?: string}} watch 状态查询参数。
     * @returns {Promise<object>} 状态数据。
     */
    async function fetchStatus(watch = {}) {
      const params = new URLSearchParams({ token, thread: watch.threadId || selectedThreadId, since: watch.since || '' });
      const res = await api(`/codex/status?${params}`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.message || '读取状态失败');
      if (!applyRelayState(data)) return currentThreadStatus || data;
      reconcileRealtimeThreadState(data);
      return data;
    }

    /**
     * AI:电脑端直接发送消息时，运行中也补拉历史，避免用户消息等到最终回复后才出现。
     *
     * @param {object} statusData 当前轮询到的运行状态。
     * @returns {Promise<void>} 历史同步完成。
     */
    async function syncRunningHistory(statusData) {
      if (!selectedThreadId || pendingWatch) return false;
      if (!statusData || (!statusData.active && statusData.status !== 'running')) return false;
      if (runningHistoryRequest) {
        await runningHistoryRequest;
        return true;
      }
      const now = Date.now();
      if (runningHistoryThreadId === selectedThreadId && now - runningHistorySyncAt < 1500) return false;
      runningHistoryThreadId = selectedThreadId;
      runningHistorySyncAt = now;
      runningHistoryRequest = loadHistory(statusData, { preserveScroll: true, silent: true });
      try {
        await runningHistoryRequest;
        return true;
      } finally {
        runningHistoryRequest = null;
      }
    }

    /**
     * 轮询 Codex 回复状态。
     *
     * @param {{threadId?: string, since?: string}} watch 轮询参数。
     * @returns {Promise<void>}
     */
    async function pollStatus(watch = pendingWatch || {}) {
      const requestedThreadId = watch.threadId || selectedThreadId;
      if (!requestedThreadId) return;
      const data = await fetchStatus({ ...watch, threadId: requestedThreadId });
      if (requestedThreadId !== selectedThreadId || data.threadId !== selectedThreadId) return;
      const waitingForDesktop = pendingWatch && pendingWatch.threadId === data.threadId;
      const commandConfirmed = isCommandConfirmed(data);
      if ((data.status === 'complete' || data.status === 'error') && waitingForDesktop && !commandConfirmed) {
        currentThreadStatus = data;
        bindPendingAssistantTurn(data);
        updateThreadStatus(data);
        renderProcessPanel(data);
        notice('正在等待电脑确认本次发送...');
        return;
      }
      if (data.status === 'complete' || data.status === 'error') {
        currentThreadStatus = data;
        bindPendingAssistantTurn(data);
        updateThreadStatus(data);
        renderProcessPanel(data);
        if (!historyReloadedForCompletion) {
          historyReloadedForCompletion = true;
          await loadHistory(data, { preserveScroll: true });
        }
      } else {
        const historySynced = await syncRunningHistory(data);
        if (!historySynced) {
          currentThreadStatus = data;
          bindPendingAssistantTurn(data);
          updateThreadStatus(data);
          renderProcessPanel(data);
        }
        historyReloadedForCompletion = false;
        notice(data.preview || 'Codex 正在回复...');
      }
    }

    /**
     * AI:合并刷新意图，优先保留带回合标识的终态，避免连续事件吞掉最终历史刷新。
     *
     * @param {object|null} current 已排队的刷新参数。
     * @param {object} incoming 新到达的刷新参数。
     * @returns {object} 合并后的刷新参数。
     */
    function mergeRealtimeRefreshOptions(current, incoming = {}) {
      const previous = current ? Object.assign({ attempt: 0 }, current) : null;
      const next = Object.assign({ attempt: 0 }, incoming);
      if (!previous) return next;
      if (next.terminal && next.turnId) return next;
      if (previous.terminal && previous.turnId) return previous;
      return next;
    }

    /**
     * AI:处理实时通道事件后的缓存刷新，并在最终回复尚未落盘时继续核对。
     *
     * @param {object} options 刷新目标、回合和重试次数。
     * @returns {void}
     */
    function scheduleRealtimeRefresh(options = {}) {
      pendingRealtimeRefreshOptions = mergeRealtimeRefreshOptions(pendingRealtimeRefreshOptions, options);
      if (realtimeRefreshTimer) return;
      const refreshOptions = pendingRealtimeRefreshOptions;
      pendingRealtimeRefreshOptions = null;
      realtimeRefreshTimer = setTimeout(async () => {
        realtimeRefreshTimer = null;
        try {
          await loadThreads();
          if (selectedThreadId) await loadHistory(null, { preserveScroll: true });
        } catch (error) {
          notice(error.message);
        } finally {
          if (refreshOptions.terminal && refreshOptions.turnId
            && selectedThreadId === refreshOptions.threadId
            && !historyHasAssistantTurn(refreshOptions.turnId)
            && refreshOptions.attempt < REALTIME_REFRESH_RETRY_LIMIT) {
            pendingRealtimeRefreshOptions = mergeRealtimeRefreshOptions(
              pendingRealtimeRefreshOptions,
              Object.assign({}, refreshOptions, { attempt: refreshOptions.attempt + 1 }),
            );
          }
          if (pendingRealtimeRefreshOptions) scheduleRealtimeRefresh();
        }
      }, refreshOptions.attempt ? REALTIME_REFRESH_RETRY_DELAY_MS : 180);
    }

    /**
     * AI:前台定时核对当前线程，避免实时事件丢失后页面长期显示旧快照。
     *
     * @returns {Promise<void>}
     */
    async function refreshCurrentThreadAutomatically() {
      try {
        await loadThreads();
        if (selectedThreadId) await loadHistory(null, { preserveScroll: true });
      } catch (error) {
        notice(error.message);
      } finally {
        scheduleAutomaticRefresh();
      }
    }

    /**
     * AI:在浏览器页面存活期间安排下一次当前线程校验。
     *
     * @returns {void}
     */
    function scheduleAutomaticRefresh() {
      if (automaticRefreshTimer) return;
      automaticRefreshTimer = setTimeout(() => {
        automaticRefreshTimer = null;
        refreshCurrentThreadAutomatically();
      }, AUTO_REFRESH_INTERVAL_MS);
    }

    /**
     * AI:Agent 直接终态、同一回合状态已确认或较新的终态快照均可移除实时覆盖。
     *
     * @param {object} status HTTP 返回的线程状态。
     * @returns {void}
     */
    function reconcileRealtimeThreadState(status) {
      const threadId = String(status?.threadId || '').trim();
      const realtime = realtimeThreadStates.get(threadId);
      if (!realtime) return;
      const authoritativeStatus = status.active || status.status === 'running' ? 'running' : status.status;
      const turns = Array.isArray(status.turns) ? status.turns : [];
      const turnConfirmed = !realtime.turnId || turns.some(turn => turn?.turnId === realtime.turnId);
      const historyHasFinalReply = Boolean(realtime.turnId && renderedHistoryRows.some(row => row
        && row.role === 'assistant'
        && row.turnId === realtime.turnId
        && row.text));
      const completedAt = Date.parse(status.completedAt || '');
      const observedAt = Date.parse(realtime.observedAt || '');
      const terminalSnapshotIsNewer = authoritativeStatus !== 'running'
        && Number.isFinite(completedAt)
        && Number.isFinite(observedAt)
        && completedAt >= observedAt;
      const directTerminalStatusIsAuthoritative = status.cached === false && authoritativeStatus !== 'running';
      const realtimeStateConfirmed = turnConfirmed && authoritativeStatus === realtime.status;
      if (!directTerminalStatusIsAuthoritative
        && !historyHasFinalReply
        && !realtimeStateConfirmed
        && !terminalSnapshotIsNewer) return;
      realtimeThreadStates.delete(threadId);
    }

    /**
     * AI:检查当前历史是否已包含目标回合的最终回复。
     *
     * @param {string} turnId App Server 回合标识。
     * @returns {boolean} 已包含非空最终回复时返回 true。
     */
    function historyHasAssistantTurn(turnId) {
      const id = String(turnId || '').trim();
      return Boolean(id && renderedHistoryRows.some(row => row && row.role === 'assistant' && row.turnId === id && row.text));
    }

    /**
     * AI:把 App Server 线程事件转换为即时状态覆盖，随后由 HTTP 数据对账。
     *
     * @param {object} event Relay 的 thread-event 消息。
     * @returns {void}
     */
    function applyRealtimeThreadEvent(event) {
      const payload = event?.event;
      const threadId = String(payload?.threadId || '').trim();
      if (!threadId) return;
      const previous = realtimeThreadStates.get(threadId);
      const seq = Number(payload.seq) || 0;
      if (previous && seq <= previous.seq) return;
      let status = '';
      let active = false;
      if (payload.type === 'turn.started') {
        status = 'running';
        active = true;
      } else if (payload.type === 'turn.completed') {
        const turnStatus = String(payload.payload?.turn?.status || '').toLowerCase();
        status = turnStatus === 'failed' ? 'error' : 'complete';
      } else if (payload.type === 'thread.status.changed') {
        const protocolStatus = String(payload.payload?.status?.type || '').toLowerCase();
        if (protocolStatus === 'active') {
          status = 'running';
          active = true;
        } else if (protocolStatus === 'idle') status = 'complete';
        else if (protocolStatus === 'systemerror') status = 'error';
      }
      if (!status) return;
      realtimeThreadStates.set(threadId, {
        threadId,
        turnId: String(payload.turnId || '').trim(),
        status,
        active,
        seq,
        observedAt: String(payload.observedAt || ''),
      });
      threadRows = threadRows.map(row => row.id === threadId ? { ...row, status, active } : row);
      if (threadId === selectedThreadId) updateThreadStatus(currentThreadStatus);
    }

    /**
     * AI:连接云端 Relay 的手机状态订阅，不退回定时轮询。
     *
     * @returns {void}
     */
    function openRealtimeSocket() {
      if (!token || realtimeSocket) return;
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${location.host}/mobile?token=${encodeURIComponent(token)}`;
      const socket = new WebSocket(url);
      realtimeSocket = socket;
      socket.addEventListener('open', () => {
        updateConnectionStatus({ online: agentOnline, message: '服务器实时连接已建立' });
      });
      socket.addEventListener('message', event => {
        try {
          const data = JSON.parse(event.data || '{}');
          if (!applyRelayState(data)) return;
          if (data.type === 'thread-event') {
            applyRealtimeThreadEvent(data);
            const payload = data.event || {};
            scheduleRealtimeRefresh({
              threadId: String(payload.threadId || '').trim(),
              turnId: String(payload.turnId || '').trim(),
              terminal: (payload.type === 'turn.completed' || payload.type === 'thread.status.changed')
                && String(payload.threadId || '').trim() === selectedThreadId,
            });
            return;
          }
          if (data.type === 'event-resync-required') {
            realtimeThreadStates.clear();
            updateThreadStatus(currentThreadStatus);
            scheduleRealtimeRefresh();
            return;
          }
          if (data.type === 'session-updated') scheduleRealtimeRefresh();
        } catch {
          notice('服务器实时事件格式不正确');
        }
      });
      socket.addEventListener('close', () => {
        if (realtimeSocket === socket) realtimeSocket = null;
        updateConnectionStatus({ offline: true, message: '服务器实时连接断开' });
        if (realtimeReconnectTimer) return;
        realtimeReconnectTimer = setTimeout(() => {
          realtimeReconnectTimer = null;
          openRealtimeSocket();
        }, 2000);
      });
      socket.addEventListener('error', () => {
        notice('服务器实时连接失败');
      });
    }

    /**
     * AI:应用版本化同步状态，旧快照不得回写页面。
     *
     * @param {object} data Relay 响应或实时事件。
     * @returns {boolean} 快照是否可用。
     */
    function applyRelayState(data) {
      if (!data || typeof data !== 'object') return true;
      const version = Number(data.syncVersion);
      if (Number.isFinite(version) && version < syncState.version) return false;
      if (Number.isFinite(version)) {
        syncState = {
          fresh: Boolean(data.syncFresh),
          version,
          lastSyncedAt: typeof data.lastSyncedAt === 'string' ? data.lastSyncedAt : syncState.lastSyncedAt,
        };
      }
      if (typeof data.appServerState === 'string') appServerState = {
        state: data.appServerState,
        updatedAt: typeof data.appServerUpdatedAt === 'string' ? data.appServerUpdatedAt : appServerState.updatedAt,
      };
      applyAgentOnline(data);
      if (!syncState.fresh && pendingWatch && (data.type === 'sync-status' || data.agentOnline === false)) {
        pendingWatch = Object.assign({}, pendingWatch, { unconfirmed: true });
        if (commandConfirmTimer) clearTimeout(commandConfirmTimer);
        commandConfirmTimer = null;
        notice('电脑同步超时，操作结果未确认，已停止继续发送。');
      }
      return true;
    }

    /**
     * AI:等待命令后的新快照，避免本地等待无限延长。
     *
     * @param {object} watch 命令观察窗口。
     * @returns {void}
     */
    function waitForCommandConfirmation(watch) {
      if (commandConfirmTimer) clearTimeout(commandConfirmTimer);
      commandConfirmTimer = setTimeout(() => {
        if (!pendingWatch || pendingWatch.threadId !== watch.threadId) return;
        pendingWatch = Object.assign({}, pendingWatch, { unconfirmed: true });
        notice('电脑尚未确认本次操作，已停止继续发送；请刷新后核对。');
      }, 12000);
    }

    document.getElementById('refresh').addEventListener('click', async () => {
      try {
        await loadThreads();
        await loadHistory(null, { preserveScroll: true });
      } catch (error) {
        notice(error.message);
      }
    });

    threadsEl.addEventListener('change', async () => {
      try {
        selectedThreadId = threadsEl.value;
        localStorage.setItem('codexBridge.threadId', selectedThreadId);
        currentThreadStatus = null;
        pendingWatch = null;
        historyReloadedForCompletion = false;
        runningHistoryRequest = null;
        runningHistorySyncAt = 0;
        runningHistoryThreadId = '';
        updateThreadStatus();
        await loadHistory(null, { preserveScroll: false, scrollToBottom: true });
      } catch (error) {
        notice(error.message);
      }
    });

    projectsEl.addEventListener('change', async () => {
      try {
        selectedProjectName = projectsEl.value;
        localStorage.setItem('codexBridge.projectName', selectedProjectName);
        selectedThreadId = '';
        currentThreadStatus = null;
        pendingWatch = null;
        historyReloadedForCompletion = false;
        runningHistoryRequest = null;
        runningHistorySyncAt = 0;
        runningHistoryThreadId = '';
        renderThreadOptions();
        await loadHistory(null, { preserveScroll: false, scrollToBottom: true });
      } catch (error) {
        notice(error.message);
      }
    });

    document.getElementById('composer').addEventListener('submit', async event => {
      event.preventDefault();
      const text = textEl.value;
      if (!text.trim()) return;
      const selectedRow = threadRows.find(item => item.id === selectedThreadId);
      const currentStatus = currentThreadStatus?.status || selectedRow?.status || '';
      const currentActive = Boolean(currentThreadStatus?.active) || Boolean(selectedRow?.active);
      if (sending || pendingWatch || currentActive || currentStatus === 'running') {
        notice('当前对话尚未完成或发送结果未确认，不能继续发送。');
        return;
      }
      textEl.value = '';
      sending = true;
      setRunning(false);
      notice('正在发送给电脑 Codex...');
      historyReloadedForCompletion = false;
      try {
        const clientUserMessageId = createClientUserMessageId();
        const baseMessageCount = renderedHistoryRows.length;
        const res = await api('/send', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text, threadId: selectedThreadId, clientUserMessageId }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || '发送失败');
        const sentAt = Date.now();
        const pendingLocal = registerPendingLocalSend(selectedThreadId, text, sentAt, baseMessageCount);
        pendingWatch = Object.assign({}, data.watch || { threadId: selectedThreadId }, {
          kind: 'send',
          acceptedSyncVersion: Number(data.acceptedSyncVersion) || syncState.version,
        });
        renderHistoryRows(mergePendingLocalMessages(selectedThreadId, renderedHistoryRows));
        scrollToBottom();
        waitForCommandConfirmation(pendingWatch);
        await pollStatus(pendingWatch);
      } catch (error) {
        if (!textEl.value) textEl.value = text;
        notice(error.message);
      } finally {
        sending = false;
        updateThreadStatus(currentThreadStatus);
      }
    });

    stopButton.addEventListener('click', async () => {
      try {
        const res = await api('/codex/stop', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ threadId: selectedThreadId }) });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || '停止失败');
        pendingWatch = {
          threadId: selectedThreadId,
          kind: 'stop',
          acceptedSyncVersion: Number(data.acceptedSyncVersion) || syncState.version,
        };
        waitForCommandConfirmation(pendingWatch);
        notice(data.message || '已发送停止指令，等待电脑确认');
        await pollStatus(pendingWatch);
      } catch (error) {
        notice(error.message);
      }
    });

    setRunning(false);
    updateConnectionStatus({ message: '正在检测连接状态' });
    refreshConnectionStatus().catch(() => {});
    loadThreads().then(() => loadHistory(null, { preserveScroll: false, scrollToBottom: true })).catch(error => notice(error.message));
    openRealtimeSocket();
    scheduleAutomaticRefresh();
  </script>
</body>
</html>
